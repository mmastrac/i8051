[package]
name = "i8051-disassembler-service"
description = "Reusable session and query layer over the i8051 disassembler."
version.workspace = true
edition = "2024"
authors.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
i8051-disassembler = { version = "0.24.0", path = "../i8051-disassembler" }
i8051-script = { version = "0.24.0", path = "../i8051-script" }
include_dir = "0.7"
minijinja = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt", "sync", "time"], optional = true }
tracing = { version = "0.1", optional = true }

[features]
# The debounced-autosave task shared by the MCP and web servers (pulls in tokio).
autosave = ["dep:tokio", "dep:tracing"]
