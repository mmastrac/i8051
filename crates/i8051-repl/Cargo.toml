[package]
name = "i8051-repl"
description = "An interactive DSL REPL for the i8051 disassembler."
version.workspace = true
edition = "2024"
authors.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "i8051-repl"
path = "src/main.rs"

[dependencies]
i8051-disassembler = { version = "0.24.0", path = "../i8051-disassembler" }
i8051-disassembler-service = { version = "0.24.0", path = "../i8051-disassembler-service" }
rustyline = { version = "15", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
